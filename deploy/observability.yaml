apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cc-cep
data:
  prometheus.yml: "global:\n  scrape_interval: 1s\nscrape_configs:\n- job_name: benchmark\n\
    \  metrics_path: /metrics/\n  static_configs:\n  - labels:\n      cohort: control\n\
    \      tier: frontend\n    targets:\n    - frontend-control:8000\n  - labels:\n\
    \      cohort: control\n      tier: dependency\n    targets:\n    - dependency-control:8000\n\
    \  - labels:\n      cohort: treatment\n      tier: frontend\n    targets:\n  \
    \  - frontend-treatment:8000\n  - labels:\n      cohort: treatment\n      tier:\
    \ dependency\n    targets:\n    - dependency-treatment:8000\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: cc-cep
data:
  datasource.yaml: "apiVersion: 1\ndatasources:\n- access: proxy\n  isDefault: true\n\
    \  name: Prometheus\n  type: prometheus\n  url: http://prometheus:9090\n"
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: cc-cep
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: cc-cep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
      annotations:
        sidecar.istio.io/inject: 'false'
    spec:
      automountServiceAccountToken: false
      containers:
      - name: prometheus
        image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
        ports:
        - containerPort: 9090
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=2h
      volumes:
      - name: config
        configMap:
          name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: cc-cep
spec:
  selector:
    app: grafana
  ports:
  - port: 3000
    targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: cc-cep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
      annotations:
        sidecar.istio.io/inject: 'false'
    spec:
      automountServiceAccountToken: false
      containers:
      - name: grafana
        image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: config
          mountPath: /etc/grafana/provisioning/datasources
        env:
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: 'true'
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: Viewer
        - name: GF_AUTH_DISABLE_LOGIN_FORM
          value: 'true'
      volumes:
      - name: config
        configMap:
          name: grafana-datasource
