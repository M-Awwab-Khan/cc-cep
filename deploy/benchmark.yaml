apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: cc-cep-fault
  namespace: cc-cep
  labels:
    cc-cep.local/managed: 'true'
  annotations:
    cc-cep.local/expires: '0'
spec:
  hosts:
  - dependency-treatment.cc-cep.svc.cluster.local
  exportTo:
  - .
  http:
  - route:
    - destination:
        host: dependency-treatment.cc-cep.svc.cluster.local
        port:
          number: 8000
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cc-cep-controller
  namespace: cc-cep
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fault-editor
  namespace: cc-cep
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  resourceNames:
  - cc-cep-safety
  verbs:
  - get
  - patch
- apiGroups:
  - networking.istio.io
  resources:
  - virtualservices
  resourceNames:
  - cc-cep-fault
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fault-editor
  namespace: cc-cep
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fault-editor
subjects:
- kind: ServiceAccount
  name: cc-cep-controller
  namespace: cc-cep
