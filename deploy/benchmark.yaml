apiVersion: v1
kind: Namespace
metadata:
  name: cc-cep
  labels:
    istio-injection: enabled
    cc-cep.local/disposable: 'true'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cc-cep-safety
  namespace: cc-cep
  labels:
    cc-cep.local/disposable: 'true'
data:
  purpose: Disposable CC-CEP lab
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-control
  namespace: cc-cep
spec:
  selector:
    app: frontend-control
    cohort: control
    tier: frontend
  ports:
  - name: http
    port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-control
  namespace: cc-cep
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: frontend-control
      cohort: control
      tier: frontend
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
      - name: app
        image: cc-cep:0.1.0
        imagePullPolicy: Never
        env:
        - name: CC_COHORT
          value: control
        - name: CC_DEPENDENCY_URL
          value: http://dependency-control:8000
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: 100m
            memory: 96Mi
          limits:
            cpu: '1'
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
---
